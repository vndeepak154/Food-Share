version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: foodshare
      MYSQL_USER: foodshare
      MYSQL_PASSWORD: foodsharepassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      interval: 5s

  # Node.js + Express Backend Service
  backend:
    build:
      context: ./food-share-backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: foodshare
      DB_PASS: foodsharepassword
      DB_NAME: foodshare
      JWT_SECRET: production-secret-key-change-in-production
      PORT: 5000
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  # React Frontend (Nginx) Service
  frontend:
    build:
      context: ./food-share-frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:5000/api
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
